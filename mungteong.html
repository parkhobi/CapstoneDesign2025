                        <button class="btn-action">확인하기</button>

                    </div>
                </div>

            </div>
            
            <div class="pagination">
                <span class="dot active"></span>
                <span class="dot"></span>

                <span class="dot"></span>

                <h4>쉽게 쉽게 너를 위해 준비한 서비스</h4>

                    <a href="#" class="service-card">
