<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>표준 이력서 - HMH</title>
    <script src="common.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="resume-layout">
        <div id="sidebar-left-placeholder"></div>

        <main class="resume-content">
            <header class="resume-header">
                <div class="header-left">
                    <span class="doc-icon icon-pdf">📄</span>
                    <strong>표준 이력서</strong>
                    <span>#2025.03 #파이낸스 하반기</span>
                </div>
                </header>

            <div class="document-viewer">
                <div class="resume-paper">
                    <div class="resume-section-top">
                        <div class="resume-photo"></div>
                        <div class="resume-info">
                            <div class="resume-line large"></div>
                            <div class="resume-line medium"></div>
                            <div class="resume-line medium"></div>
                        </div>
                    </div>
                    <div class="resume-line full"></div>
                    <div class="resume-line full"></div>
                    <div class="resume-line full"></div>
                    <div class="resume-section-box"></div>
                    <div class="resume-section-box"></div>
                </div>
            </div>

            <footer class="resume-footer">
                <p>변경하고 싶은 부분이 있어? 말만해!</p>
                <div class="footer-buttons">
                    <button class="btn-correction">교정/교열 선택하기 <span>신규</span></button>
                    <button class="btn-edit">직접 수정하기</button>
                    <i class="fas fa-microphone"></i>
                    <i class="fas fa-image"></i>
                </div>
            </footer>
        </main>

        <div id="sidebar-right-placeholder"></div>

    </div> 
    <script src="common.js"></script>
</body>
</html>
