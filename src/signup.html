<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - HMH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-center-form">
    <div class="signup-box">
        <h1>회원가입</h1>
        
        <form id="signup-form">
        <!-- <form action="add-info.html"> ######  유효성검사를 위해 위 코드로 잠시 대체함 -->
            <div class="input-group">
                <label for="username">아이디</label>
                <input type="text" id="username" placeholder="아이디를 입력하세요" required>
                <p class="error-message" id="username-error"></p>
            </div>
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
                <p class="error-message" id="password-error"></p>
            </div>
            <div class="input-group">
                <label for="password-confirm">비밀번호 확인</label>
                <input type="password" id="password-confirm" placeholder="비밀번호를 다시 입력하세요" required>
                <p class="error-message" id="password-confirm-error"></p>
            </div>
             <div class="input-group">
                <label for="email">이메일 (선택)</label>
                <input type="email" id="email" placeholder="이메일 입력">
            </div>

            <button type="submit" class="signup-button">가입하고 추가정보 입력</button>
        </form>

        <div class="login-link">
            이미 계정이 있으신가요? <a href="login.html">로그인</a>
        </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
