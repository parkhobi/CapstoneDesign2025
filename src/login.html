<!DOCTYPE html>
<html>
<head>
    <title>하면해</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-center-form">
    <header>
        </header>

    <main>
        <div class="container"> 
            <div class="intro-section"> 
                <img src="\HMH 로고.png" alt="HMH 로고" class="logo"> <p class="greeting">안녕하세요!</p>
            </div>

            <div class="login-box">
                <h1>로그인</h1>
                <form id="login-form">
                    <div class="input-group">
                        <label for="username">아이디</label>
                        <input type="text" id="username" placeholder="아이디를 입력하세요">
                    </div>
                    
                    <div class="input-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" placeholder="비밀번호를 입력하세요">
                    </div>

                    <p id="login-error" class="error-message"></p>

                    <button type="button" id="login-button" class="login-button">로그인</button>
                </form>
                <div class="links-container">
                    <a href="signup.html">회원가입</a>
                    <span class="divider">|</span> <a href="#">아이디/비밀번호 찾기</a>
                </div>
            </div>
        </div>

    </main>

    <script src="login.js"></script>
</body>
</html>
