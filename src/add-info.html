<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추가 정보 입력 - HMH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-center-form-scroll">
    <div class="signup-container">
        <h1>추가 정보 입력</h1>
        <p class="signup-description">
            회원가입이 완료되었습니다! 🎉<br>
            정확한 진로 상담을 위해 이력서 정보를 입력해 주세요.
        </p>
        
        <form action="signup-success.html">
            <h2>기본 정보</h2>
            <div class="input-row">
                <div class="input-group half-width">
                    <label for="name-ko">이름 (한글)</label>
                    <input type="text" id="name-ko" placeholder="홍길동" required>
                </div>
                <div class="input-group half-width">
                    <label for="name-en">영문 이름</label>
                    <input type="text" id="name-en" placeholder="Gildong Hong" required>
                </div>
            </div>
            
            <div class="input-row">
                <div class="input-group half-width">
                    <label for="gender">성별</label>
                    <input type="text" id="gender" placeholder="남/여" required>
                </div>
                <div class="input-group half-width">
                    <label for="nationality">국적</label>
                    <input type="text" id="nationality" placeholder="대한민국" required>
                </div>
            </div>

            <div class="input-group">
                <label for="address">주소</label>
                <input type="text" id="address" placeholder="시/구/동 번지수 등 상세주소 입력" required>
            </div>

            <h2>연락처</h2>
            <div class="input-group">
                <label for="email">이메일</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            <div class="input-group">
                <label for="phone">전화번호</label>
                <input type="tel" id="phone" placeholder="010-1234-5678" required>
            </div>

            <button type="submit" class="signup-button">완료</button>
        </form>
    </div>
    <script src="add-info.js"></script>
</body>
</html>
