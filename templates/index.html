{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMH - 메인</title>
    <script src="{% static 'js/common.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="main-layout">
        {% include '_sidebar-left.html' %}
        <div id="sidebar-left-placeholder"></div>

        <main class="main-content">
            <header class="main-top-bar">
                </header>
            
            <div class="content-wrapper">
                <h1>안녕하세요 <span id="user-greeting">홍길동</span>님,<br>무엇을 도와드릴까요?</h1>
                
                <div class="prompt-box">
                    <textarea id="home-prompt" placeholder="HMH에게 무엇이든 물어보세요..."></textarea>
                    <div class="prompt-icons">
                        <i class="fas fa-microphone"></i>
                        <i class="fas fa-image"></i>
                        <i id="home-submit" class="fas fa-search"></i> 
                    </div>
                </div>

                <section class="content-section">
                    <h4>취업 준비의 꽃 = 서류 준비</h4>
                    <div class="card-row">
                        <a href="/resume/" class="document-card">
                            <span class="doc-icon icon-pdf">📄</span>
                            <div class="card-text">
                                <strong>표준 이력서</strong>
                                <span>한번 만들어 두면 10만년 씀</span>
                            </div>
                        </a>
                        <a href="/experience/" class="document-card">
                            <span class="doc-icon icon-gdoc">📘</span>
                            <div class="card-text">
                                <strong>경험 정리 서류</strong>
                                <span>너만의 경험 도토리 창고</span>
                            </div>
                        </a>
                        <a href="/mungteong/" class="document-card">
                            <span class="doc-icon icon-gslides">📗</span>
                            <div class="card-text">
                                <strong>뭉텅이</strong>
                                <span>일단 저장</span>
                            </div>
                        </a>
                    </div>
                </section>
            </div>
        </main>

    </div>
    <script src="{% static 'js/common.js' %}"></script>
    <script>
        // index.html에 추가할 스크립트
        document.addEventListener('DOMContentLoaded', () => {
            const homePrompt = document.getElementById('home-prompt');
            const homeSubmit = document.getElementById('home-submit');

            // 채팅 시작 함수
            function startChat() {
                const promptText = homePrompt.value;
                if (promptText.trim() === "") return; // 내용이 없으면 중단

                // [핵심] 사용자의 첫 질문을 localStorage에 저장
                localStorage.setItem('initialPrompt', promptText);
                
                // 새로운 채팅 페이지로 이동
                window.location.href = '/chat/';
            }

            // 1. 검색 아이콘 클릭 시
            homeSubmit.addEventListener('click', startChat);

            // 2. Enter 키 입력 시 (Shift+Enter는 줄바꿈)
            homePrompt.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault(); // 기본 Enter 동작(줄바꿈) 방지
                    startChat();
                }
            });
        });

    </script>
</body>
</html>
