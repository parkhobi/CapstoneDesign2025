{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 정보 수정 - HMH</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/common.js' %}"></script>
</head>
<body class="body-center-form-scroll">
    <div class="signup-container">
        <h1>내 정보 수정</h1>
        <p class="signup-description">
            기본 정보 및 학력 정보를 수정할 수 있습니다.
        </p>
        
        <form id="profile-form">
            <h2>기본 정보</h2>
            <div class="input-group">
                <label for="name">이름</label>
                <input type="text" id="name" placeholder="이름 입력" required>
            </div>
            
            <div class="input-row">
                <div class="input-group half-width">
                    <select id="gender" required>
                        <option value="">성별 선택</option>
                        <option value="M">남성</option> <option value="F">여성</option> 
                    </select>
                </div>
                <div class="input-group half-width">
                    <label for="birthdate">출생 연도</label>
                    <input type="text" id="birthdate" placeholder="출생 연도 입력">
                </div>
            </div>

            <div class="input-group">
                <label for="phone">전화번호 (선택)</label>
                <input type="tel" id="phone" placeholder="전화번호 입력">
            </div>

            <h2>학력 정보</h2>
            <div class="input-group">
                <label for="school">학교</label>
                <input type="text" id="school" placeholder="학교 선택">
            </div>
            <div class="input-group">
                <label for="major">전공</label>
                <input type="text" id="major" placeholder="전공 선택">
            </div>
            
            <div class="input-row">
                <div class="input-group half-width">
                    <label for="admission-year">입학 연도</label>
                    <input type="text" id="admission-year" placeholder="입학 연도 선택">
                </div>
                <div class="input-group half-width">
                    <label for="graduation-year">졸업 연도</label>
                    <input type="text" id="graduation-year" placeholder="졸업 연도 선택">
                </div>
            </div>

            <button type="submit" class="signup-button">저장하기</button>
        </form>
    </div>
    <script src="{% static 'js/profile.js' %}"></script>
</body>
</html>
